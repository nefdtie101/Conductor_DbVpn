events {
    worker_connections 1024;
}

stream {
    # PostgreSQL upstream
    upstream postgres {
        server ${POSTGRES_HOST}:${POSTGRES_PORT};
    }

    # PostgreSQL reverse proxy
    server {
        listen 5432;
        proxy_pass postgres;
        proxy_connect_timeout 10s;
        proxy_timeout 300s;
        proxy_buffer_size 16k;
    }
}

# HTTP server for health checks
http {
    server {
        listen 8080;

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /status {
            access_log off;
            return 200 "DB VPN is running\n";
            add_header Content-Type text/plain;
        }
    }
}

