apiVersion: v1
kind: Namespace
metadata:
  name: db-vpn

---
# =============================================================================
# CONFIGURATION SECTION - UPDATE THESE VALUES FOR YOUR DEPLOYMENT
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: wireguard-config
  namespace: db-vpn
data:
  wg0.conf: |
    [Interface]
    # This pod's VPN address (assigned by WireGuard server)
    Address = YOUR_CLIENT_VPN_ADDRESS
    # REPLACE WITH YOUR CLIENT PRIVATE KEY (generate with: wg genkey)
    PrivateKey = YOUR_CLIENT_PRIVATE_KEY_HERE
    # Optional: DNS servers to use through VPN
    # DNS = 1.1.1.1, 8.8.8.8

    [Peer]
    # REPLACE WITH YOUR WIREGUARD SERVER'S PUBLIC KEY
    PublicKey = YOUR_WIREGUARD_SERVER_PUBLIC_KEY_HERE
    # REPLACE WITH YOUR WIREGUARD SERVER'S ENDPOINT (IP:PORT)
    Endpoint = YOUR_WIREGUARD_SERVER_IP:51820
    # Networks accessible through VPN (use 0.0.0.0/0 for all traffic or specific subnets)
    AllowedIPs = YOUR_ALLOWED_IPS
    # Keep connection alive through NAT
    PersistentKeepalive = 25


---
# =============================================================================
# SERVICE CONFIGURATION
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: db-vpn-service
  namespace: db-vpn
spec:
  # Change to NodePort or keep as ClusterIP since we're not exposing WireGuard
  type: ClusterIP
  selector:
    app: db-vpn
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP

---
# =============================================================================
# DEPLOYMENT CONFIGURATION
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-vpn
  namespace: db-vpn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-vpn
  template:
    metadata:
      labels:
        app: db-vpn
    spec:
      # Use pod network (NOT host network) - won't interfere with cluster networking
      hostNetwork: false
      dnsPolicy: ClusterFirst
      containers:
      - name: db-vpn
        # REPLACE WITH YOUR DOCKER IMAGE
        # Format: registry/image:tag
        # Example: ghcr.io/username/db-vpn:latest
        image: YOUR_DOCKER_IMAGE_HERE
        imagePullPolicy: Always
        securityContext:
          capabilities:
            add:
              - NET_ADMIN
          privileged: false
        ports:
          - containerPort: 5432
            protocol: TCP
            name: postgres
        env:
          # Configure PostgreSQL endpoint here - no need to rebuild image!
          - name: POSTGRES_HOST
            value: "oneag-postgress.oneag-postgress.svc.cluster.local"
          - name: POSTGRES_PORT
            value: "5432"
          - name: LISTEN_PORT
            value: "5432"
        volumeMounts:
          - name: wireguard-config
            mountPath: /etc/wireguard
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
        - name: wireguard-config
          configMap:
            name: wireguard-config
