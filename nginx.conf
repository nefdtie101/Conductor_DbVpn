# Load stream module (required for TCP/UDP proxying)
load_module /usr/lib/nginx/modules/ngx_stream_module.so;

events {
    worker_connections 1024;
}

stream {
    # PostgreSQL upstream - Kubernetes service inside cluster
    upstream postgres {
        server postgrespod:5432;
    }

    # PostgreSQL reverse proxy
    # VPN clients (e.g., 192.168.10.4) connect to this pod's VPN IP (192.168.10.7:5432)
    # and get proxied to the Kubernetes PostgreSQL service
    server {
        listen 0.0.0.0:5432;
        proxy_pass postgres;
        proxy_connect_timeout 10s;
        proxy_timeout 300s;
        proxy_buffer_size 16k;
    }
}

# HTTP server for health checks
http {
    server {
        listen 8080;

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /status {
            access_log off;
            return 200 "DB VPN is running\n";
            add_header Content-Type text/plain;
        }
    }
}
