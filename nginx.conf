events {
    worker_connections 1024;
}

stream {
    # PostgreSQL upstream
    # Set the upstream server to the database DNS/hostname and port as seen from the VPN
    upstream postgres {
        # Example: server 10.8.0.5:5432;
        # Replace with your actual database DNS/hostname and port
        server YOUR_POSTGRES_VPN_HOST:YOUR_POSTGRES_PORT;
    }

    # PostgreSQL reverse proxy
    server {
        listen 0.0.0.0:5432;
        proxy_pass postgres;
        proxy_connect_timeout 10s;
        proxy_timeout 300s;
        proxy_buffer_size 16k;
    }
}

# HTTP server for health checks
http {
    server {
        listen 8080;

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /status {
            access_log off;
            return 200 "DB VPN is running\n";
            add_header Content-Type text/plain;
        }
    }
}
