[Interface]
# Your VPN address assigned by the WireGuard server
Address = 10.8.0.2/24
# Your client private key (generate with: wg genkey)
PrivateKey = ${WIREGUARD_PRIVATE_KEY}

# Optional: DNS servers to use through VPN
# DNS = 1.1.1.1, 8.8.8.8

[Peer]
# WireGuard server's public key
PublicKey = SERVER_PUBLIC_KEY_HERE
# WireGuard server endpoint (external IP or hostname)
Endpoint = vpn-server.example.com:51820
# Networks accessible through VPN (use specific subnets or 0.0.0.0/0 for all)
AllowedIPs = 10.8.0.0/24
# Keep connection alive
PersistentKeepalive = 25
